name: "expert_interview"
description: "一级市场专家访谈纪要"
sections:
  - title: "会议概况"
    prompt: "简述会议时间、参与方、目的"
  - title: "公司及行业概览"
    prompt: "提炼公司定位、行业现状"
  - title: "核心竞争力"
    prompt: "总结技术、市场、团队优势"
  - title: "增长驱动与规划"
    prompt: "产品管线、市场扩张计划"
  - title: "财务表现与核实"
    prompt: "关键财务数据及一致性"
  - title: "风险与挑战"
    prompt: "管理层提及或隐含的风险"
  - title: "Q&A 精选"
    prompt: "提取有价值的问答"
  - title: "总结与核心结论"
    prompt: "3-5 个核心 Takeaway，区分事实与推断"
