active_llm: openrouter_free

llm_providers:
  openrouter_free:
    provider: "openrouter"
    api_key: "${OPENROUTER_API_KEY}"
    base_url: "https://openrouter.ai/api/v1"
    model: "google/gemini-2.0-flash-lite-preview-02-05"
    description: "推荐默认，完全免费，有速率限制（60 req/min）"

  deepseek:
    provider: "deepseek"
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-v4-flash"
    description: "低成本付费（约 1 元/百万 token），备选"

  openai:
    provider: "openai"
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    model: "gpt-5.6-luna"
    description: "付费，高性能"

  ollama:
    provider: "ollama"
    base_url: "http://localhost:11434/v1"
    model: "qwen2.5:7b"
    description: "数据零上云，需8GB+显存，速度较慢"

active_asr: groq

asr_providers:
  groq:
    provider: "groq"
    api_key: "${GROQ_API_KEY}"
    model: "whisper-large-v3-turbo"
    base_url: "https://api.groq.com/openai/v1"
    description: "Groq Cloud 免费 Whisper API，完全免费，无需信用卡"
    max_file_size_mb: 25
    chunk_duration_minutes: 10
    overlap_seconds: 5
    max_retries: 3

  siliconflow:
    provider: "siliconflow"
    api_key: "${SILICONFLOW_API_KEY}"
    model: "FunAudioLLM/SenseVoiceSmall"
    base_url: "https://api.siliconflow.cn/v1"
    description: "硅基流动 SenseVoiceSmall（中文优化）"
    max_file_size_mb: 50
    chunk_duration_minutes: 30
    overlap_seconds: 5
    max_retries: 3

logging:
  level: "INFO"
  file: "finminutes.log"
  redact_transcript: true
  redact_api_key: true
