[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finminutes"
dynamic = ["version"]
description = "AI 金融会议纪要 Agent - Transcript to Professional Minutes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "openai>=1.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydub>=0.25.1",
    "python-docx>=0.8.11",
    "PyMuPDF>=1.20",
]

[project.scripts]
finminutes = "finminutes.cli:main"

[project.optional-dependencies]
# 音近错词检测（term_corrector.scan_phonetic）依赖拼音库；未安装时该能力自动降级为不可用，
# 精确替换与热词偏置不受影响。
phonetic = ["pypinyin>=0.50"]
# 说话人分离（core/diarization）。模型不随包分发，装完依赖后另跑
# `python docs/tools/download_diarization_models.py` 下载约 33MB 模型。
diarization = ["sherpa-onnx>=1.10", "numpy>=1.24"]

[tool.setuptools.dynamic]
version = {attr = "finminutes.__version__"}

[tool.setuptools.packages.find]
include = ["finminutes*"]

[tool.setuptools.package-data]
# 显式列出要打包的数据文件：data/** 通配会误包本地未跟踪/敏感文件（如 cx_bg.yaml）
finminutes = [
    "config.yaml",
    "data/backgrounds/example.yaml",
    "data/glossary/semiconductor.yaml",
    "templates/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
