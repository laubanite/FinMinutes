[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finminutes"
version = "1.0.0"
description = "AI 金融会议纪要 Agent - Transcript to Professional Minutes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "openai>=1.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydub>=0.25.1",
    "python-docx>=0.8.11",
    "PyMuPDF>=1.20",
]

[project.scripts]
finminutes = "finminutes.cli:main"

[tool.setuptools.packages.find]
include = ["finminutes*"]

[tool.setuptools.package-data]
finminutes = ["config.yaml", "data/**/*", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
